library:
  schema:
    enabled: true
    registry-url: https://apicurio-registry-cit-kaas-int.ingress.cph01.ocp.six-group.net/apis/ccompat/v7/subjects/
    ignore-ssl: false
    user: ${SCHEMA_REGISTRY_USER}
    pass: ${SCHEMA_REGISTRY_PASS}
  runner:
    enabled: true
  restproxy:
    enabled: true

app:
  kafka:
    rest-proxy-url: https://rft-confluent-cito-rest-rft-int-bec.ingress.cph01.ocp.six-group.net/topics
    schema-url-suffix: /versions/latest
    topic-name: test-topic
    key-payload-file: samples/key.json
    value-payload-file: samples/value.json
    # "test-topic" doesn't exist as a subject in the real dev registry yet:
    # set to a real topic name (see below) before flipping this to true.
    send-sample-message: false
