library:
  schema:
    enabled: true
    registry-url: https://apicurio-registry-cit-kaas-int.ingress.cph01.ocp.six-group.net/apis/ccompat/v7/subjects/
    ignore-ssl: false
    user: ${SCHEMA_REGISTRY_USER}
    pass: ${SCHEMA_REGISTRY_PASS}
  runner:
    enabled: true
  restproxy:
    enabled: true

app:
  kafka:
    rest-proxy-url: https://rft-confluent-cito-rest-rft-int-bec.ingress.cph01.ocp.six-group.net/topics
    schema-url-suffix: /versions/latest
    # "test-topic" (the shared default) doesn't exist as a subject in the
    # real dev registry: override --app.kafka.topic-name=<real-topic> and
    # --app.kafka.send-sample-message=true (or auto-generate-sample=true)
    # per run instead of hardcoding a topic here.
    send-sample-message: false
