# Fill in the real INTEGRATION host names/credentials before use.
library:
  schema:
    enabled: true
    registry-url: https://<schema-registry-integration-host>/subjects/
    ignore-ssl: false
    user: ${SCHEMA_REGISTRY_USER}
    pass: ${SCHEMA_REGISTRY_PASS}
  runner:
    enabled: true
  restproxy:
    enabled: true

app:
  kafka:
    rest-proxy-url: https://<kafka-rest-proxy-integration-host>/topics
    schema-url-suffix: /versions/latest
    topic-name: test-topic
    key-payload-file: samples/key.json
    value-payload-file: samples/value.json
