apiVersion: batch/v1
kind: Job
metadata:
  name: register-avro-schemas
  annotations:
    argocd.argoproj.io/hook: PostSync
    argocd.argoproj.io/hook-delete-policy: BeforeHookCreation
spec:
  backoffLimit: 6
  template:
    metadata:
      labels:
        app.kubernetes.io/name: avro-schema-registrar
    spec:
      restartPolicy: OnFailure
      securityContext:
        runAsNonRoot: true
        seccompProfile:
          type: RuntimeDefault
      containers:
        - name: registrar
          image: curlimages/curl:8.10.1
          command: ["/bin/sh", "-ec"]
          args:
            - |
              registry="http://schema-registry.kafka-shared.svc.cluster.local:8081"
              until curl --fail --silent --show-error "${registry}/subjects" >/dev/null; do
                sleep 5
              done

              for schema_path in /schemas/*.avsc; do
                subject="$(basename "${schema_path}" .avsc)"
                schema="$(tr -d '\r\n' < "${schema_path}")"
                escaped="$(printf '%s' "${schema}" | sed 's/\\/\\\\/g; s/"/\\"/g')"
                payload="$(printf '{"schemaType":"AVRO","schema":"%s"}' "${escaped}")"
                curl --fail --silent --show-error \
                  --request POST \
                  --header "Content-Type: application/vnd.schemaregistry.v1+json" \
                  --data "${payload}" \
                  "${registry}/subjects/${subject}/versions"
                printf '\nRegistered %s\n' "${subject}"
              done
          volumeMounts:
            - name: schemas
              mountPath: /schemas
              readOnly: true
          resources:
            requests:
              cpu: 10m
              memory: 16Mi
            limits:
              cpu: 100m
              memory: 64Mi
          securityContext:
            allowPrivilegeEscalation: false
            capabilities:
              drop: ["ALL"]
      volumes:
        - name: schemas
          configMap:
            name: avro-schemas
