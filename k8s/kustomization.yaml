apiVersion: kustomize.config.k8s.io/v1beta1
kind: Kustomization

namespace: kafka-shared

resources:
  - namespace.yaml
  - zookeeper-service.yaml
  - zookeeper-statefulset.yaml
  - kafka-service.yaml
  - kafka-statefulset.yaml
  - schema-registry.yaml
  - avro-schema-registrar.yaml
  - rest-proxy.yaml
  - kafka-ui.yaml
  - kafka-connect.yaml
  - redpanda-console.yaml

labels:
  - pairs:
      app.kubernetes.io/part-of: shared-kafka-platform
      app.kubernetes.io/managed-by: argocd

generatorOptions:
  disableNameSuffixHash: true

configMapGenerator:
  - name: avro-schemas
    files:
      - schemas/crypto-prices-in-value.avsc
      - schemas/crypto-prices-out-value.avsc
      - schemas/orders-topic1-value.avsc
      - schemas/total-sales-topic1-value.avsc
      - schemas/lecturas-sensores-value.avsc
      - schemas/totales-sensores-value.avsc
