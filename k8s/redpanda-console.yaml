apiVersion: v1
kind: ConfigMap
metadata:
  name: redpanda-console-config
data:
  config.yaml: |
    kafka:
      brokers:
        - kafka.kafka-shared.svc.cluster.local:9092
    schemaRegistry:
      enabled: true
      urls:
        - http://schema-registry.kafka-shared.svc.cluster.local:8081
    server:
      listenPort: 8080
---
apiVersion: v1
kind: Service
metadata:
  name: redpanda-console
spec:
  selector:
    app.kubernetes.io/name: redpanda-console
  ports:
    - name: http
      port: 8080
      targetPort: http
---
apiVersion: apps/v1
kind: Deployment
metadata:
  name: redpanda-console
spec:
  replicas: 1
  selector:
    matchLabels:
      app.kubernetes.io/name: redpanda-console
  template:
    metadata:
      labels:
        app.kubernetes.io/name: redpanda-console
    spec:
      enableServiceLinks: false
      securityContext:
        seccompProfile:
          type: RuntimeDefault
      containers:
        - name: redpanda-console
          image: docker.redpanda.com/redpandadata/console:v3.9.0
          imagePullPolicy: IfNotPresent
          ports:
            - name: http
              containerPort: 8080
          env:
            - name: CONFIG_FILEPATH
              value: /etc/redpanda-console/config.yaml
          volumeMounts:
            - name: config
              mountPath: /etc/redpanda-console
              readOnly: true
          readinessProbe:
            tcpSocket:
              port: http
            initialDelaySeconds: 10
            periodSeconds: 10
          livenessProbe:
            tcpSocket:
              port: http
            initialDelaySeconds: 30
            periodSeconds: 20
          resources:
            requests:
              cpu: 50m
              memory: 128Mi
            limits:
              cpu: 500m
              memory: 512Mi
          securityContext:
            allowPrivilegeEscalation: false
            capabilities:
              drop: ["ALL"]
      volumes:
        - name: config
          configMap:
            name: redpanda-console-config
