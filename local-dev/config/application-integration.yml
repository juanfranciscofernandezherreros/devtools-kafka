# Reference configuration for applications that consume
# com.devkafka:rft-devtools-kafka-cucumber
# and run against the shared INTEGRATION environment (real Schema Registry /
# REST Proxy, not the local Docker stack). See also application-dev.yml and
# application-qa.yml for the other shared environments.
#
# Copy the relevant section into the consuming Spring Boot app's own
# src/main/resources/application-integration.yml, fill in the real host
# names below, and activate with:
#   --spring.profiles.active=integration
#
# Do NOT put this file inside the library's own src/main/resources (see
# application-local.yml for why).

library:
  schema:
    enabled: true
    registry-url: https://<schema-registry-integration-host>/subjects/
    ignore-ssl: false
    user: ${SCHEMA_REGISTRY_USER}
    pass: ${SCHEMA_REGISTRY_PASS}
    basic-token-base64:
  runner:
    enabled: true
  restproxy:
    enabled: true

# Not bound by the library itself: GenericRunnerBean.run(keyFile, valueFile,
# schemaRegistry, topicName, restProxyUrl, urlPrefix) takes these as plain
# method arguments. The consuming app should bind its own
# @ConfigurationProperties(prefix = "app.kafka") and pass the values through
# when calling runner.run(...).
app:
  kafka:
    rest-proxy-url: https://<kafka-rest-proxy-integration-host>/topics
    schema-url-suffix: /versions/latest
    topic-name: test-topic
