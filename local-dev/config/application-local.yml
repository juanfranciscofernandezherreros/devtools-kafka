# Reference configuration for applications that consume
# com.devkafka:rft-devtools-kafka-cucumber
# and run against the local Docker stack (local-dev/docker-compose.yml).
#
# Copy the relevant section into the consuming Spring Boot app's own
# src/main/resources/application-local.yml and activate with:
#   --spring.profiles.active=local
#
# Do NOT put this file inside the library's own src/main/resources: any
# Spring Boot app that pulls in this jar and activates a "local" profile
# would silently inherit it from the classpath.

library:
  schema:
    enabled: true
    registry-url: http://localhost:8081/subjects/
    ignore-ssl: true
    user:
    pass:
    basic-token-base64:
  runner:
    enabled: true
  restproxy:
    enabled: true

# Not bound by the library itself: GenericRunnerBean.run(keyFile, valueFile,
# schemaRegistry, topicName, restProxyUrl, urlPrefix) takes these as plain
# method arguments. The consuming app should bind its own
# @ConfigurationProperties(prefix = "app.kafka") and pass the values through
# when calling runner.run(...).
app:
  kafka:
    rest-proxy-url: http://localhost:8082/topics
    schema-url-suffix: /versions/latest
    topic-name: test-topic
